<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="L&amp;L horizontal lockup">
  <title>L&amp;L 标准组合 · 横版</title>
  <desc>图标在左、标准字在右。图标高度等于标准字 x 高度的 3.2 倍，间距为图标宽度的 0.25。</desc>
  <defs>
    <linearGradient id="lock-grad" x1="24" y1="70" x2="220" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E6B5A"/>
      <stop offset="1" stop-color="#2E6E95"/>
    </linearGradient>
  </defs>

  <!-- 图标：192 × 192，内边距按安全区预留 -->
  <g transform="translate(24,24)">
    <rect x="0" y="0" width="192" height="192" rx="42" fill="#F7F5EF"/>
    <g transform="scale(0.375)" fill="none" stroke="url(#lock-grad)"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M 138 132 V 378 H 386" stroke-width="74"/>
      <path d="M 228 196 V 300 H 340" stroke-width="50"/>
    </g>
  </g>

  <!-- 标准字：L&L，& 用次级灰并缩小 -->
  <g transform="translate(272,0)">
    <text x="0" y="150"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="112" font-weight="600" letter-spacing="-3"
          fill="#1E6B5A">L<tspan font-size="78" fill="#8C9A94" dx="2">&#38;</tspan><tspan dx="2">L</tspan></text>
  </g>
</svg>
