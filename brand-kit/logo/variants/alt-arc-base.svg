<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="L&amp;L alt arc base">
  <title>L&amp;L 备选 · 圆弧托底</title>
  <desc>两枚 L 的底笔连成一整条圆弧，中央一点作 &amp; 的暗示。整体像一张笑脸，最亲和。</desc>
  <defs>
    <linearGradient id="alt2-grad" x1="110" y1="120" x2="402" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E6B5A"/>
      <stop offset="1" stop-color="#2E6E95"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#F7F5EF"/>
  <g fill="none" stroke="url(#alt2-grad)" stroke-width="62"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 150 140 V 300"/>
    <path d="M 362 140 V 300"/>
    <!-- 底部一整条圆弧托底：两枚 L 的底笔连成一体 -->
    <path d="M 150 300 A 128 92 0 0 0 362 300"/>
  </g>
  <!-- 中央圆点：& 的暗示 -->
  <circle cx="256" cy="238" r="34" fill="#266D8A"/>
</svg>
